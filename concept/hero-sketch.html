<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8x — Life at 8x (concept sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* 8x.careers tokens, extracted from the live site */
  :root {
    --paper: #FCFBF6;
    --stone: #F0F0EB;
    --mist: #E9ECE2;
    --sage: #B5BAAA;
    --moss: #555E4D;
    --ink: #252722;
    --deep: #181C17;
    --vermilion: #C73D20;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Geist", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --gutter: clamp(16px, 4.4vw, 64px);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  .grid-lines { position: absolute; inset: 0 var(--gutter); display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; }
  .grid-lines span { border-left: 1px solid color-mix(in srgb, var(--sage) 38%, transparent); }
  .grid-lines span:last-child { border-right: 1px solid color-mix(in srgb, var(--sage) 38%, transparent); }

  header { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 22px var(--gutter); border-bottom: 1px solid var(--ink); padding-inline: 0; }
  .mark { font-family: var(--serif); font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
  .mark small { font-family: var(--sans); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--moss); margin-left: 14px; vertical-align: 6px; }
  nav { display: flex; gap: 28px; align-items: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  nav a { color: var(--ink); text-decoration: none; }
  nav a.apply { background: var(--vermilion); color: #fff; padding: 11px 16px; border-radius: 10px; letter-spacing: .08em; }
  nav .count { color: var(--vermilion); }

  .hero { position: relative; min-height: 100svh; padding: 0 var(--gutter); overflow: hidden; }
  .draft { position: relative; z-index: 2; padding-top: clamp(56px, 9vh, 110px); font-family: var(--sans); font-weight: 400; font-size: clamp(28px, 4.2vw, 60px); letter-spacing: -0.045em; line-height: 1; color: var(--moss); }
  .draft .tag { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--moss); margin-bottom: 18px; text-transform: uppercase; }
  .caret { display: inline-block; width: .06em; height: .9em; background: var(--moss); vertical-align: -0.08em; margin-left: .04em; animation: blink 1s steps(1) infinite; }
  .caret.done { opacity: 0; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  h1 { position: relative; z-index: 2; font-family: var(--serif); font-weight: 400; font-size: clamp(64px, 11.2vw, 172px); line-height: .9; letter-spacing: -0.035em; margin-top: clamp(10px, 1.6vw, 22px); }
  h1 .line { display: block; opacity: 0; transform: translateY(.18em); transition: opacity .7s ease, transform .9s cubic-bezier(.2,.7,.1,1); }
  h1.in .line { opacity: 1; transform: none; }
  h1.in .line:nth-child(2) { transition-delay: .12s; }
  .circled { position: relative; display: inline-block; }
  .circled svg { position: absolute; left: -9%; top: -4%; width: 118%; height: 118%; overflow: visible; }
  .ink { fill: none; stroke: var(--vermilion); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .draw.go { transition: stroke-dashoffset var(--dur, .9s) cubic-bezier(.6,.05,.3,1); stroke-dashoffset: 0; }

  .note { position: absolute; z-index: 3; font-family: var(--serif); font-style: italic; color: var(--vermilion); font-size: clamp(20px, 1.8vw, 26px); line-height: 1.1; opacity: 0; transition: opacity .5s ease .1s; }
  .note.go { opacity: 1; }
  .note-people { left: calc(var(--gutter) + 46vw); top: clamp(300px, 36vw, 520px); }
  .note-people svg { position: absolute; left: -30px; top: 58px; width: 90px; height: 110px; overflow: visible; }

  .prints { position: relative; z-index: 1; display: flex; gap: clamp(10px, 1.4vw, 22px); margin-top: clamp(40px, 6vw, 86px); padding-left: 1vw; }
  .print { flex: 0 0 auto; width: clamp(128px, 13.4vw, 204px); background: #fff; padding: 8px 8px 12px; box-shadow: 0 1px 0 rgba(37,39,34,.06), 0 12px 30px -18px rgba(37,39,34,.35); transform: rotate(var(--r)) translateY(var(--y)); opacity: 0; transition: opacity .6s ease, transform 1s cubic-bezier(.2,.7,.1,1); }
  .print.in { opacity: 1; }
  .print img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; filter: saturate(.92); }
  .print figcaption { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .print figcaption em { font-style: normal; color: var(--moss); letter-spacing: .08em; }
  .print .play { position: absolute; right: 16px; top: 16px; width: 26px; height: 26px; border-radius: 50%; background: rgba(252,251,246,.92); display: grid; place-items: center; }
  .print .play::after { content: ""; border-left: 8px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .print { position: relative; }

  .facts { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: clamp(40px, 5vw, 72px); border-top: 1px solid var(--ink); }
  .facts div { padding: 16px 16px 28px 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--moss); }
  .facts b { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 3vw, 44px); letter-spacing: -0.02em; text-transform: none; color: var(--ink); margin-bottom: 6px; }

  @media (max-width: 760px) {
    nav a:not(.apply) { display: none; }
    .grid-lines { grid-template-columns: repeat(2, 1fr); }
    .grid-lines span:nth-child(n+3) { display: none; }
    .grid-lines span:nth-child(2) { border-right: 1px solid color-mix(in srgb, var(--sage) 38%, transparent); }
    .prints { overflow-x: auto; margin-inline: calc(var(--gutter) * -1); padding: 12px var(--gutter) 24px; scroll-snap-type: x mandatory; }
    .print { scroll-snap-align: start; }
    .note-people { position: relative; left: auto; top: auto; margin-top: 22px; display: block; }
    .note-people svg { display: none; }
    .facts { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<section class="hero">
  <div class="grid-lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <header>
    <div class="mark">8x<small>Life at 8x</small></div>
    <nav>
      <a href="#people">People</a>
      <a href="#work">The work</a>
      <a href="#hiring">How we hire</a>
      <a href="#roles">Roles <span class="count">16</span></a>
      <a class="apply" href="#roles">Apply</a>
    </nav>
  </header>

  <p class="draft"><span class="tag">first draft · generated</span><span id="typed"></span><span class="caret" id="caret"></span></p>

  <h1 id="h1" aria-label="People decide what's good.">
    <span class="line"><span class="circled">people<svg viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path class="ink draw" id="ring" d="M40 22 C 120 4, 250 6, 282 40 C 304 70, 250 108, 150 110 C 60 112, 10 92, 14 60 C 18 32, 70 14, 130 12 C 170 11, 205 16, 232 24"/></svg></span> decide</span>
    <span class="line">what&rsquo;s good.</span>
  </h1>

  <p class="note note-people" id="note">these ones,<br>specifically
    <svg viewBox="0 0 90 110" aria-hidden="true"><path class="ink draw" id="arrow" style="--dur:.6s" d="M60 4 C 30 30, 18 60, 26 100 M 12 84 C 18 92, 22 98, 26 102 C 32 94, 38 88, 46 84"/></svg>
  </p>

  <div class="prints" id="people">
    <figure class="print" style="--r:-2.2deg;--y:18px"><img src="https://www.8x.careers/landing/testimonials/zoja-poster.webp" alt="Zoja"><span class="play"></span><figcaption>Zoja <em>Watch</em></figcaption></figure>
    <figure class="print" style="--r:1.4deg;--y:-6px"><img src="https://www.8x.careers/landing/testimonials/jaka-poster.webp" alt="Jaka, CEO"><span class="play"></span><figcaption>Jaka <em>CEO</em></figcaption></figure>
    <figure class="print" style="--r:-0.8deg;--y:26px"><img src="https://www.8x.careers/landing/testimonials/vania-poster.webp" alt="Vania"><span class="play"></span><figcaption>Vania <em>Watch</em></figcaption></figure>
    <figure class="print" style="--r:2deg;--y:4px"><img src="https://www.8x.careers/landing/testimonials/theo-poster.webp" alt="Theo, CTO"><span class="play"></span><figcaption>Theo <em>CTO</em></figcaption></figure>
    <figure class="print" style="--r:-1.6deg;--y:30px"><img src="https://www.8x.careers/landing/testimonials/sami-poster.webp" alt="Sami"><span class="play"></span><figcaption>Sami <em>Watch</em></figcaption></figure>
    <figure class="print" style="--r:1deg;--y:10px"><img src="https://www.8x.careers/landing/testimonials/maham-poster.webp" alt="Maham"><span class="play"></span><figcaption>Maham <em>Watch</em></figcaption></figure>
  </div>

  <div class="facts">
    <div><b>250k+</b>humans in the loop</div>
    <div><b>50+</b>countries</div>
    <div><b>$7M+</b>raised</div>
    <div><b>15 min</b>to apply</div>
  </div>
</section>

<script>
  const text = "ai writes the first draft.";
  const typed = document.getElementById('typed');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.draw').forEach(p => p.style.setProperty('--len', Math.ceil(p.getTotalLength())));

  function reveal() {
    document.getElementById('caret').classList.add('done');
    document.getElementById('h1').classList.add('in');
    setTimeout(() => document.getElementById('ring').classList.add('go'), 750);
    setTimeout(() => { document.getElementById('note').classList.add('go'); document.getElementById('arrow').classList.add('go'); }, 1500);
    document.querySelectorAll('.print').forEach((p, i) => setTimeout(() => p.classList.add('in'), 900 + i * 90));
  }
  if (reduce) { typed.textContent = text; reveal(); }
  else {
    let i = 0;
    const tick = () => { typed.textContent = text.slice(0, ++i); i < text.length ? setTimeout(tick, 38 + Math.random() * 40) : setTimeout(reveal, 420); };
    setTimeout(tick, 500);
  }
</script>
</body>
</html>
